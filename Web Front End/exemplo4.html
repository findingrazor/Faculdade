<html>
	<body>
		<h1>Loop com for</h1>
		<div id="teste"> </div>
		<button onclick="listar('teste')"> Listar </button>
		<script>
			function listar(valor) {
				let lista = "";
				for(let x = 0; x < 10; x++) {
					lista += '<h3>Header '+ x +'</h3>'
				}
				document.getElementById(valor).innerHTML = lista;
			}
		</script>
	</body>
</html>
