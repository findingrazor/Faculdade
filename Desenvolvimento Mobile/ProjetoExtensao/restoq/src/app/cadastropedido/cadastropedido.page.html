<div class="ion-page" id="main-content">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button class="botao-seta">
          <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <div class="ion-padding">
      <div class="texto-container">
        <h1 class="titulo">Novo Pedido</h1>
      </div>
      <br><br>
      <div class="input-container">
        <ion-list class="input-list">
          <div class="campo-grupo">
            <h2 class="titulo">Produto</h2>
            <ion-item class="campo">
              <ion-input value="ex: Sabonete Amarelo"></ion-input>
              <ion-button slot="end" class="botao-lapis">
                <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
          <br>
          <div class="campo-grupo" style="flex-direction: row;">
            <div>
              <h2 class="titulo">Quantidade</h2>
              <ion-item class="campo campo-alt">
                <ion-input></ion-input>
                <ion-button slot="end" class="botao-lapis">
                  <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
                </ion-button>
              </ion-item>
            </div>
            <div class="buttons-container" style="width: min-content;">
              <ion-button fill="outline" class="button-alt">ADICIONAR</ion-button>
            </div>
          </div>
          <br>
          <div>

            <ion-card class="card-resumo-venda">

              <div class="cabecalho-resumo">
                <span>Produto</span>
                <span>Quantidade</span>
                <span>Valor (UN)</span>
              </div>

              <div class="item-resumo">
                <div class="coluna-produto">
                  <span class="marca-produto">Hidratante Tododia</span>
                </div>

                <div class="coluna-quantidade">
                  <span>0</span>
                </div>

                <div class="coluna-valor">
                  <span>R$ 79,99</span>
                </div>
              </div>

              <div class="acao-adicionar">
                <ion-button fill="clear" class="botao-adicionar">
                  Adicionar mais
                </ion-button>
              </div>

            </ion-card>

          </div>
          <br>
          <div class="campo-grupo" style="flex-direction: row;">
            <div style="width: fit-content;">
              <h2 class="titulo">Valor Total</h2>
              <ion-item class="campo campo-alt">
                <b>R$</b>
                <ion-input placeholder="99,99"></ion-input>
              </ion-item>
            </div>
            <div style="width: fit-content;">
              <h2 class="titulo">Data Venda</h2>
              <ion-item class="campo campo-alt">
                <ion-input placeholder="DD/MM/AAAA"></ion-input>
              </ion-item>
            </div>
          </div>
          <br>
        </ion-list>
      </div>
      <div class="buttons-container">
        <ion-button shape="round">FINALIZAR</ion-button>
      </div>
    </div>
    <div class="footer">
      <div class="footer-art">
        <img class="onda onda-1" src="assets/footer/onda1.svg" alt="" />
        <img class="onda onda-2" src="assets/footer/onda2.svg" alt="" />
        <img class="onda onda-3" src="assets/footer/onda3.svg" alt="" />
      </div>
    </div>
  </ion-content>
</div>
