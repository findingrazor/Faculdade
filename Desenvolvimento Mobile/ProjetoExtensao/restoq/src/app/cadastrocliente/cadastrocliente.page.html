<div class="ion-page" id="main-content">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button class="botao-seta">
          <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <div class="ion-padding">
      <div class="texto-container">
        <h1 class="titulo">Novo Cliente</h1>
      </div>
      <br><br>
      <div class="input-container">
        <ion-list class="input-list">
          <div class="campo-grupo">
            <h2 class="titulo">Nome</h2>
            <ion-item class="campo">
              <ion-input value="ex: Elaine Freitas"></ion-input>
              <ion-button slot="end" class="botao-lapis">
                <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
          <br>
          <div class="campo-grupo">
            <h2 class="titulo">CPF</h2>
            <ion-item class="campo">
              <ion-input value="ex: 123.456.789-00"></ion-input>
              <ion-button slot="end" class="botao-lapis">
                <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
          <br>
          <div class="campo-grupo">
            <h2 class="titulo">Email</h2>
            <ion-item class="campo">
              <ion-input value="ex: cliente@email.com" type="email"></ion-input>
              <ion-button slot="end" class="botao-lapis">
                <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
          <br>
          <div class="campo-grupo">
            <h2 class="titulo">Telefone</h2>
            <ion-item class="campo">
              <ion-input value="ex: (00) 00000-0000" type="tel"></ion-input>
              <ion-button slot="end" class="botao-lapis">
                <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
          <br>
        </ion-list>
      </div>
      <div class="buttons-container">
        <ion-button shape="round">SALVAR</ion-button>
      </div>
    </div>
    <div class="footer">
      <div class="footer-art">
        <img class="onda onda-1" src="assets/footer/onda1.svg" alt="" />
        <img class="onda onda-2" src="assets/footer/onda2.svg" alt="" />
        <img class="onda onda-3" src="assets/footer/onda3.svg" alt="" />
      </div>
    </div>
  </ion-content>
</div>
