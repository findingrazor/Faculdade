<html lamg="pt-BR">

<body>
    <button>Clique aqui</button>
    <style>
        button {
            background-color: aqua;

            cursor: pointer;      
        }
    </style> 
</body>
<script>
    let botao = document.querySelector("button");

    botao.onclick = function () {
        let nome = prompt("Qual o seu nome?");

    };
</script>
