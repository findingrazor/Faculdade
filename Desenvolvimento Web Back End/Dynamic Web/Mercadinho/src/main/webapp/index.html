<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mercadinho Web</title>
</head>
<body>
	<h2>Adicionar ao Carrinho</h2>
	<form action="AdicionarItemServlet" method="post">
		Produto : <input type="text" name="produto" id="busca" onkeyup="buscarReceitas()" 
		placeholder="Ingredientes de qual receita deseja?...">
		<ul id="listaReceitas"></ul>
		
		<button type="submit">Adicionar</button>
	</form>
	<br>
	<a href="ExibirCarrinhoServlet">Ver meu carrinho</a>
	<script>
		function buscarReceitas() {
			const query = document.getElementById('busca').value;
			const lista = document.getElementById('listaReceitas');
			fetch(`ReceitasServlet?q=${query}`).then(res => res.json()).then(data => {
				lista.innerHTML = data.map(receita => `<li><strong>${receita.nome}</strong> - ${receita.ingredientes} [${receita.cat}]</li>`).join('');});
			}
	</script>
</body>
</html>
