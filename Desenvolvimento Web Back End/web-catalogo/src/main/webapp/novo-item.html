<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Cadastro - Star Wars</title>
</head>
<body>
 <h2>Adicionar Novo Personagem ao Catálogo</h2>
 
 <form action="cadastrar" method="POST">
 <label>Nome do Personagem:</label><br>
 <input type="text" name="nome" required><br><br>
 
 <label>Classe:</label><br>
 <textarea name="classe" rows="3"></textarea><br><br>
 
 <label>Raça:</label><br>
 <textarea name="raca" rows="3"></textarea><br><br>
 
 <label>Preço (R$):</label><br>
 <input type="number" step="0.01" name="preco" required><br><br>
 
 <label>URL da Imagem do Personagem:</label><br>
 <input type="url" name="urlImagem" 
placeholder="https://exemplo.com/imagem.jpg"><br><br>
 
 <button type="submit">Salvar no Catálogo</button>
 </form>
</body>
</html>
